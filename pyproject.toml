[project]
name = "daytrace"
version = "1.0.0"
description = "A life, in little traces: a local-first reconstruction of your workday."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
daytrace = "daytrace.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daytrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
