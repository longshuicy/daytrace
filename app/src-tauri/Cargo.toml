[package]
name = "daytrace-app"
version = "1.0.0"
description = "daytrace desktop: menu-bar icon, floating pill, day view"
edition = "2021"

[lib]
name = "daytrace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde_json = "1"
